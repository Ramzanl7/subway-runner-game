<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 780px;
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #90EE90 40%, #228B22 100%);
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .score-box {
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 1px 2px #000;
  }
  #coins {
    color: #FFD700;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    color: white;
    text-align: center;
  }
  #overlay h1 {
    font-size: 42px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #00ff88;
  }
  #overlay p {
    font-size: 18px;
    margin: 6px 0;
    opacity: 0.9;
  }
  #startBtn, #restartBtn {
    margin-top: 24px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #00c853, #00e676);
    color: #000;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,200,83,0.5);
    transition: transform 0.15s;
  }
  #startBtn:hover, #restartBtn:hover {
    transform: scale(1.05);
  }
  #controlsHint {
    position: absolute;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    pointer-events: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="score-box">🏃 <span id="score">0</span></div>
    <div class="score-box" id="coins">🪙 <span id="coinCount">0</span></div>
  </div>
  <div id="overlay">
    <h1>SUBWAY RUNNER</h1>
    <p>Беги по путям, уворачивайся от препятствий!</p>
    <p>← → или свайп — сменить полосу</p>
    <p>↑ / Пробел / свайп вверх — прыжок</p>
    <button id="startBtn">СТАРТ</button>
  </div>
  <div id="controlsHint" class="hidden">← → прыжок</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const coinEl = document.getElementById('coinCount');

let W, H, laneWidth;
const LANES = 3;
let gameRunning = false;
let score = 0;
let coins = 0;
let speed = 6;
let frame = 0;

const player = {
  lane: 1,
  targetLane: 1,
  x: 0,
  y: 0,
  width: 40,
  height: 60,
  jumping: false,
  jumpY: 0,
  jumpVelocity: 0,
  color: '#FF5722'
};

let obstacles = [];
let coinsList = [];
let particles = [];
let groundOffset = 0;

function resize() {
  const container = document.getElementById('gameContainer');
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W;
  canvas.height = H;
  laneWidth = W / LANES;
  player.x = laneWidth * player.lane + laneWidth / 2 - player.width / 2;
  player.y = H - 140;
}

window.addEventListener('resize', resize);
resize();

window.addEventListener('keydown', e => {
  if (!gameRunning) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
  if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') jump();
});

let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!gameRunning) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) changeLane(1);
    else if (dx < -30) changeLane(-1);
  } else {
    if (dy < -30) jump();
  }
}, {passive: false});

function changeLane(dir) {
  const newLane = player.targetLane + dir;
  if (newLane >= 0 && newLane < LANES) {
    player.targetLane = newLane;
  }
}

function jump() {
  if (!player.jumping) {
    player.jumping = true;
    player.jumpVelocity = -16;
  }
}

function spawnObstacle() {
  const lane = Math.floor(Math.random() * LANES);
  obstacles.push({
    lane,
    y: -80,
    width: laneWidth * 0.7,
    height: 50,
    type: Math.random() > 0.7 ? 'train' : 'box'
  });
}

function spawnCoin() {
  const lane = Math.floor(Math.random() * LANES);
  coinsList.push({
    lane,
    y: -30,
    radius: 12
  });
}

function update() {
  if (!gameRunning) return;

  frame++;
  score = Math.floor(frame / 5);
  scoreEl.textContent = score;
  coinEl.textContent = coins;

  speed = 6 + Math.floor(score / 150);

  const targetX = laneWidth * player.targetLane + laneWidth / 2 - player.width / 2;
  player.x += (targetX - player.x) * 0.25;
  player.lane = player.targetLane;

  if (player.jumping) {
    player.jumpVelocity += 0.9;
    player.jumpY += player.jumpVelocity;
    if (player.jumpY >= 0) {
      player.jumpY = 0;
      player.jumping = false;
      player.jumpVelocity = 0;
    }
  }

  groundOffset = (groundOffset + speed) % 40;

  if (frame % Math.max(25, 50 - Math.floor(score / 100)) === 0) {
    spawnObstacle();
  }
  if (frame % 40 === 0) {
    spawnCoin();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += speed;
    if (o.y > H + 50) {
      obstacles.splice(i, 1);
      continue;
    }
    if (!player.jumping || player.jumpY > -30) {
      const px = player.x + player.width / 2;
      const py = player.y + player.jumpY;
      const ox = laneWidth * o.lane + laneWidth / 2;
      const oy = o.y + o.height / 2;
      if (Math.abs(px - ox) < (player.width + o.width) / 2 - 10 &&
          Math.abs(py - oy) < (player.height + o.height) / 2 - 5) {
        gameOver();
        return;
      }
    }
  }

  for (let i = coinsList.length - 1; i >= 0; i--) {
    const c = coinsList[i];
    c.y += speed;
    if (c.y > H + 20) {
      coinsList.splice(i, 1);
      continue;
    }
    const px = player.x + player.width / 2;
    const py = player.y + player.jumpY + player.height / 2;
    const cx = laneWidth * c.lane + laneWidth / 2;
    const cy = c.y;
    if (Math.hypot(px - cx, py - cy) < 40) {
      coins++;
      for (let p = 0; p < 8; p++) {
        particles.push({
          x: cx, y: cy,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20,
          color: '#FFD700'
        });
      }
      coinsList.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  skyGrad.addColorStop(0, '#4FC3F7');
  skyGrad.addColorStop(1, '#81D4FA');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.45);

  ctx.fillStyle = '#37474F';
  for (let i = 0; i < 8; i++) {
    const bx = (i * 60 + (frame * 0.3) % 60) % (W + 60) - 30;
    const bh = 40 + Math.sin(i * 1.7) * 30;
    ctx.fillRect(bx, H * 0.45 - bh, 40, bh);
  }

  const groundY = H * 0.45;
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, groundY, W, H - groundY);

  for (let l = 0; l < LANES; l++) {
    const lx = laneWidth * l + laneWidth / 2;
    ctx.strokeStyle = '#546E7A';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(lx - 25, groundY);
    ctx.lineTo(lx - 25, H);
    ctx.moveTo(lx + 25, groundY);
    ctx.lineTo(lx + 25, H);
    ctx.stroke();

    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 8;
    for (let y = groundY - groundOffset; y < H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(lx - 35, y);
      ctx.lineTo(lx + 35, y);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  for (let l = 1; l < LANES; l++) {
    ctx.beginPath();
    ctx.moveTo(laneWidth * l, groundY);
    ctx.lineTo(laneWidth * l, H);
    ctx.stroke();
  }

  obstacles.forEach(o => {
    const ox = laneWidth * o.lane + laneWidth / 2 - o.width / 2;
    if (o.type === 'train') {
      ctx.fillStyle = '#E53935';
      ctx.fillRect(ox, o.y, o.width, o.height);
      ctx.fillStyle = '#B71C1C';
      ctx.fillRect(ox + 5, o.y + 8, o.width - 10, 15);
      ctx.fillStyle = '#81D4FA';
      ctx.fillRect(ox + 10, o.y + 10, 12, 10);
      ctx.fillRect(ox + o.width - 22, o.y + 10, 12, 10);
    } else {
      ctx.fillStyle = '#FF9800';
      ctx.fillRect(ox, o.y, o.width, o.height);
      ctx.fillStyle = '#E65100';
      ctx.fillRect(ox + 4, o.y + 4, o.width - 8, o.height - 8);
      ctx.fillStyle = '#212121';
      for (let s = 0; s < 3; s++) {
        ctx.fillRect(ox + 8 + s * 18, o.y + 12, 10, 25);
      }
    }
  });

  coinsList.forEach(c => {
    const cx = laneWidth * c.lane + laneWidth / 2;
    ctx.beginPath();
    ctx.arc(cx, c.y, c.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    ctx.strokeStyle = '#FFA000';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - 4, c.y - 4, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  });

  const py = player.y + player.jumpY;
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, py, player.width, player.height);
  ctx.beginPath();
  ctx.arc(player.x + player.width / 2, py - 12, 16, 0, Math.PI * 2);
  ctx.fillStyle = '#FFCC80';
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(player.x + player.width / 2 - 5, py - 14, 3, 0, Math.PI * 2);
  ctx.arc(player.x + player.width / 2 + 5, py - 14, 3, 0, Math.PI * 2);
  ctx.fill();
  if (!player.jumping) {
    const legOffset = Math.sin(frame * 0.4) * 6;
    ctx.fillStyle = '#1565C0';
    ctx.fillRect(player.x + 6, py + player.height - 5, 10, 18 + legOffset);
    ctx.fillRect(player.x + 24, py + player.height - 5, 10, 18 - legOffset);
  } else {
    ctx.fillStyle = '#1565C0';
    ctx.fillRect(player.x + 6, py + player.height - 5, 10, 12);
    ctx.fillRect(player.x + 24, py + player.height - 5, 10, 12);
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 20;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  gameRunning = true;
  score = 0;
  coins = 0;
  frame = 0;
  speed = 6;
  obstacles = [];
  coinsList = [];
  particles = [];
  player.lane = 1;
  player.targetLane = 1;
  player.jumping = false;
  player.jumpY = 0;
  overlay.classList.add('hidden');
  document.getElementById('controlsHint').classList.remove('hidden');
}

function gameOver() {
  gameRunning = false;
  overlay.innerHTML = `
    <h1 style="color:#FF5252">GAME OVER</h1>
    <p>Счёт: <b>${score}</b></p>
    <p>Монеты: <b>${coins}</b> 🪙</p>
    <button id="restartBtn">ЕЩЁ РАЗ</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('controlsHint').classList.add('hidden');
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

startBtn.addEventListener('click', startGame);

gameLoop();
</script>
</body>
</html>
